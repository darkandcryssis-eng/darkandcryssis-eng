<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="Evasion — обход блокировок для Windows без VPN. Discord, YouTube и Telegram снова работают.">
  <defs>
    <radialGradient id="rwash"><stop stop-color="#3423c4"/><stop offset=".55" stop-color="#2a1c96" stop-opacity=".35"/><stop offset="1" stop-color="#2a1c96" stop-opacity="0"/></radialGradient>
    <filter id="rhalo" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="13.0"/></filter>
    <filter id="rcore" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4.0"/></filter>
    <clipPath id="clip"><rect width="1280" height="300" rx="32"/></clipPath>
    <linearGradient id="grid" x1="0" x2="1"><stop stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".05"/></linearGradient>
    <pattern id="lines" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0V26" stroke="url(#grid)" stroke-width="1"/></pattern>
    <linearGradient id="fade" x1="0" x2="1"><stop offset=".35" stop-color="#050506"/><stop offset="1" stop-color="#050506" stop-opacity="0"/></linearGradient>
  </defs>
  <g clip-path="url(#clip)" font-family="'Segoe UI Variable Display','Segoe UI',Inter,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif">
    <rect width="1280" height="300" fill="#050506"/>
    <rect x="620" width="660" height="300" fill="url(#lines)"/>
  <circle cx="1090" cy="150" r="136" fill="url(#rwash)" opacity=".6"/>
  <circle cx="1090" cy="150" r="78" fill="#0b0b12"/>
  <g fill="none" stroke-linecap="round">
    <circle cx="1090" cy="150" r="78" stroke="#5442ff" stroke-width="20.4" filter="url(#rhalo)"><animate attributeName="opacity" values=".75;1;.75" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="1090" cy="150" r="78" stroke="#7c6cff" stroke-width="10.7" filter="url(#rcore)"/>
    <circle cx="1090" cy="150" r="78" stroke="#f1efff" stroke-width="5.7"/>
  </g>
  <circle cx="1090" cy="150" r="16.9" fill="#7c6cff" filter="url(#rcore)"/>
  <circle cx="1090" cy="150" r="10.2" fill="#fff"/><g><circle cx="1090" cy="72" r="2.6" fill="#fff" filter="url(#rcore)"/><animateTransform attributeName="transform" type="rotate" from="0 1090 150" to="360 1090 150" dur="9s" repeatCount="indefinite"/></g>
    <rect width="860" height="300" fill="url(#fade)"/>
    <g transform="translate(64 50)">
      <circle cx="19" cy="19" r="18.5" fill="#000" stroke="#fff" stroke-opacity=".16"/>
      <circle cx="19" cy="19" r="10" fill="none" stroke="#e9e7ff" stroke-width="2"/><circle cx="19" cy="19" r="2.6" fill="#fff"/>
      <text x="52" y="27" font-size="25" font-weight="600" fill="#f5f5f7" letter-spacing="-.6">evasion</text>
    </g>
    <text x="63" y="150" font-size="38" font-weight="600" fill="#f5f5f7" letter-spacing="-1.4">Discord, YouTube и Telegram снова работают</text>
    <text x="64" y="190" font-size="19" fill="#a9a9b4">Обход блокировок для Windows без VPN: один .exe и одна кнопка.</text>
    <rect x="64" y="222" width="65" height="34" rx="17.0" fill="#121214" stroke="#fff" stroke-opacity=".14"/><circle cx="82" cy="239.0" r="4" fill="#7c6cff"/><text x="96" y="244.4" font-size="14" fill="#d6d6de" font-weight="500">Go</text><rect x="141" y="222" width="151" height="34" rx="17.0" fill="#121214" stroke="#fff" stroke-opacity=".14"/><circle cx="159" cy="239.0" r="4" fill="#7c6cff"/><text x="173" y="244.4" font-size="14" fill="#d6d6de" font-weight="500">Wails + React</text><rect x="304" y="222" width="120" height="34" rx="17.0" fill="#121214" stroke="#fff" stroke-opacity=".14"/><circle cx="322" cy="239.0" r="4" fill="#7c6cff"/><text x="336" y="244.4" font-size="14" fill="#d6d6de" font-weight="500">WinDivert</text>
  </g>
  <rect x=".5" y=".5" width="1279" height="299" rx="31.5" fill="none" stroke="#fff" stroke-opacity=".09"/>
</svg>
